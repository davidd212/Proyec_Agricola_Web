<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="200" height="200" fill="#f5f0f8"/>
  
  <!-- Sombra -->
  <ellipse cx="100" cy="170" rx="60" ry="15" fill="rgba(0,0,0,0.1)"/>
  
  <!-- Espigas de Trigo -->
  <g id="wheat">
    <!-- Tallo principal -->
    <path d="M 100 140 Q 98 110 95 80 Q 93 50 100 30" 
          stroke="#8B6F47" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Hojas -->
    <path d="M 100 40 Q 90 45 85 35" stroke="#27AE60" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 100 60 Q 110 65 115 55" stroke="#2ECC71" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 98 85 Q 88 90 83 80" stroke="#27AE60" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 102 100 Q 112 105 117 95" stroke="#2ECC71" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 97 120 Q 87 125 82 115" stroke="#27AE60" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Espiga principal (arriba) -->
    <g id="spike1">
      <g fill="#F4D03F" stroke="#E8C83A" stroke-width="0.5">
        <!-- Granos en la espiga -->
        <ellipse cx="100" cy="35" rx="3" ry="4"/>
        <ellipse cx="98" cy="38" rx="3" ry="4"/>
        <ellipse cx="102" cy="38" rx="3" ry="4"/>
        <ellipse cx="96" cy="42" rx="3" ry="4"/>
        <ellipse cx="104" cy="42" rx="3" ry="4"/>
        <ellipse cx="100" cy="45" rx="3" ry="4"/>
      </g>
    </g>
    
    <!-- Espiga del medio -->
    <g id="spike2">
      <g fill="#F4D03F" stroke="#E8C83A" stroke-width="0.5">
        <ellipse cx="95" cy="70" rx="3" ry="4"/>
        <ellipse cx="93" cy="73" rx="3" ry="4"/>
        <ellipse cx="97" cy="73" rx="3" ry="4"/>
        <ellipse cx="91" cy="77" rx="3" ry="4"/>
        <ellipse cx="99" cy="77" rx="3" ry="4"/>
      </g>
    </g>
    
    <!-- Espiga inferior -->
    <g id="spike3">
      <g fill="#F4D03F" stroke="#E8C83A" stroke-width="0.5">
        <ellipse cx="105" cy="100" rx="3" ry="4"/>
        <ellipse cx="103" cy="103" rx="3" ry="4"/>
        <ellipse cx="107" cy="103" rx="3" ry="4"/>
        <ellipse cx="101" cy="107" rx="3" ry="4"/>
        <ellipse cx="109" cy="107" rx="3" ry="4"/>
      </g>
    </g>
    
    <!-- Raíces -->
    <g stroke="#8B6F47" stroke-width="1.5" fill="none" stroke-linecap="round">
      <path d="M 100 140 Q 85 150 75 155"/>
      <path d="M 100 140 Q 115 150 125 155"/>
      <path d="M 100 140 L 100 160"/>
    </g>
  </g>
  
  <!-- Texto -->
  <text x="100" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#8B6F47">
    Semillas de Trigo
  </text>
</svg>
